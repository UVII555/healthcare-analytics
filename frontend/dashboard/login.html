<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect — Login</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;height:100vh}
  .login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px;width:320px}
  .login-box h1{font-size:18px;color:var(--green);margin-bottom:4px}
  .login-box p{font-size:12px;color:var(--text2);margin-bottom:20px}
  .login-box input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:10px}
  .login-box button{width:100%;background:var(--green);color:#000;border:none;border-radius:6px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;margin-top:6px}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
  <div class="login-box">
    <h1>🏥 MedConnect</h1>
    <p>Hospital admin login</p>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="doLogin()">Log in</button>
    <div class="login-error" id="loginError">Invalid email or password.</div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
